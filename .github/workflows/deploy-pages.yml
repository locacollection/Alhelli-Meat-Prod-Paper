name: Deploy Meat Production website
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "barcode-learning.html"
      - "barcode-learning.css"
      - "barcode-learning-core.js"
      - "barcode-learning.js"
      - "barcode-learning-price.js"
      - "supabase/price-history.sql"
      - "barcode-learning-labels.js"
      - "barcode-learning-scan.js"
      - "fish-production.html"
      - "fish-production.css"
      - "fish-core.js"
      - "fish-barcode-samples.js"
      - "fish-production.js"
      - "fish-store.js"
      - "custom-barcodes.html"
      - "custom-barcodes.js"
      - "barcode-catalog.html"
      - "weight-price-checker.html"
      - "weight-price-checker.css"
      - "weight-price-checker.js"
      - "barcode-predictor.html"
      - "barcode-predictor.css"
      - "barcode-predictor.js"
      - "barcode-tester.html"
      - "barcode-tester.css"
      - "barcode-tester-core.js"
      - "barcode-tester.js"
      - "scanner.js"
      - "sheet-crop.js"
      - "sheet-crop.css"
      - "live-barcode.js"
      - "paper-store.js"
      - "scanner.css"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html barcode-learning.html barcode-learning.css barcode-learning-core.js barcode-learning.js barcode-learning-labels.js barcode-learning-scan.js barcode-learning-price.js sheet-crop.js sheet-crop.css fish-production.html fish-production.css fish-core.js fish-barcode-samples.js fish-production.js fish-store.js custom-barcodes.html barcode-catalog.html weight-price-checker.html weight-price-checker.css weight-price-checker.js barcode-predictor.html barcode-predictor.css barcode-predictor.js barcode-tester.html barcode-tester.css barcode-tester-core.js barcode-tester.js scanner.js custom-barcodes.js live-barcode.js paper-store.js scanner.css manual-worksheet.html _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
