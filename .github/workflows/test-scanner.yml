name: Check barcode scanner
on:
  push:
    branches: [main]
    paths:
      - "scanner.js"
      - "paper-store.js"
      - "tests/validate-paper-store.cjs"
      - "tests/validate-scanner.cjs"
      - ".github/workflows/test-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check scanner.js && node --check paper-store.js
      - name: Test barcode and label calculations
        run: node tests/validate-scanner.cjs
      - name: Test paper saving and preview
        run: node tests/validate-paper-store.cjs
