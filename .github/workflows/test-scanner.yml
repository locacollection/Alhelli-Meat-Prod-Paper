name: Check barcode scanner
on:
  push:
    branches: [main]
    paths:
      - "scanner.js"
      - "barcode-learning-core.js"
      - "barcode-learning.js"
      - "barcode-learning-labels.js"
      - "barcode-learning-scan.js"
      - "tests/validate-barcode-learning-ocr.cjs"
      - "tests/validate-label-orientation.cjs"
      - "tests/validate-confirm-agreement.cjs"
      - "tests/validate-number-box-ocr.cjs"
      - "tests/validate-barcode-learning.cjs"
      - "fish-core.js"
      - "fish-barcode-samples.js"
      - "tests/validate-fish-samples.cjs"
      - "fish-production.js"
      - "fish-store.js"
      - "tests/validate-fish.cjs"
      - "custom-barcodes.js"
      - "weight-price-checker.js"
      - "barcode-predictor.js"
      - "tests/validate-barcode-predictor.cjs"
      - "tests/validate-custom-barcodes.cjs"
      - "live-barcode.js"
      - "paper-store.js"
      - "tests/validate-paper-store.cjs"
      - "tests/validate-scanner.cjs"
      - ".github/workflows/test-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check barcode-learning-core.js && node --check barcode-learning-labels.js && node --check barcode-learning-scan.js && node --check barcode-learning.js && node --check scanner.js && node --check custom-barcodes.js && node --check weight-price-checker.js && node --check barcode-predictor.js && node --check live-barcode.js && node --check paper-store.js && node --check fish-core.js && node --check fish-barcode-samples.js && node --check fish-production.js && node --check fish-store.js
      - name: Test barcode and label calculations
        run: node tests/validate-confirm-agreement.cjs && node tests/validate-fish-samples.cjs && node tests/validate-label-orientation.cjs && node tests/validate-barcode-learning-ocr.cjs && node tests/validate-number-box-ocr.cjs && node tests/validate-barcode-learning.cjs && node tests/validate-scanner.cjs && node tests/validate-live-barcode.cjs && node tests/validate-custom-barcodes.cjs && node tests/validate-fish.cjs && node tests/validate-barcode-predictor.cjs
      - name: Test paper saving and preview
        run: node tests/validate-paper-store.cjs
